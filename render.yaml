services:
  # 1. Backend Service (Express + Socket.io + Prisma + PostgreSQL)
  - type: web
    name: el-mana-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install && npx prisma db push && npx prisma db seed && npx prisma generate
    startCommand: cd backend && npm start
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: el-mana-db
          property: connectionString
      - key: NODE_ENV
        value: production

  # 2. Frontend Service (Vite + React Static Site)
  - type: web
    name: el-mana-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://el-mana-backend.onrender.com

databases:
  - name: el-mana-db
    plan: free
