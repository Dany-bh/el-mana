services:
  # 1. Backend Service (Express + Socket.io + Prisma + PostgreSQL)
  - type: web
    name: el-mana-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate
    releaseCommand: cd backend && npx prisma db push && npx prisma db seed
    startCommand: cd backend && npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.15.0"

  # 2. Frontend Service (Vite + React Static Site)
  - type: web
    name: el-mana-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: el-mana-backend
          property: host
      - key: NODE_VERSION
        value: "20.15.0"
